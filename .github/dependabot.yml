# SEC-10: weekly update pull requests for Python (locked), npm and the pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: tuesday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: tuesday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # TypeScript 7 (the native compiler) is not supported by Next.js 16 / eslint-config-next yet; stay on 5.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
