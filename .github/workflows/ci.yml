# Code CI: lint, types, tests, both warehouses, the website and its accessibility, on every push and PR.
# Model-quality checks on real data are not here (they depend on upstream data, not on code); they gate the
# weekly refresh instead (audit SWE-3).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # SEC-11: read-only token for all CI jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies (hashes verified)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Versions agree (pyproject, dbt, web, changelog)
        run: python scripts/check_versions.py
      - name: Documentation links resolve
        run: python scripts/check_links.py
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip
      - name: Ingest committed raw data into DuckDB (bronze)
        run: python -m immodash_ingest --offline
      - name: dbt build (silver + gold + data tests; data-recency tests run in the weekly refresh)
        working-directory: dbt
        run: dbt build --profiles-dir . --exclude tag:freshness
      - name: Unit, API contract and pipeline tests with coverage
        run: pytest -q --cov --cov-report=term --cov-fail-under=80
      - name: End-to-end verification report
        run: python scripts/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-report
          path: reports/

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: immodash
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: immodash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U immodash" --health-interval 5s --health-retries 10
    env:
      WAREHOUSE_URL: postgresql+psycopg://immodash:ci-only-password@localhost:5432/immodash
      DBT_TARGET: prod
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - run: python -m immodash_ingest --offline
      - working-directory: dbt
        run: dbt build --profiles-dir . --exclude tag:freshness
      - run: python -m ml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Build warehouse and export a fresh snapshot (checks the export runs)
        run: |
          python -m immodash_ingest --offline
          (cd dbt && dbt build --profiles-dir . --quiet --exclude tag:freshness)
          python -m ml
          python scripts/export_static.py --no-llm --out /tmp/snapshot
          python scripts/validate_snapshot.py --dir /tmp/snapshot
      - name: Validate the committed snapshot the site is built from
        run: python scripts/validate_snapshot.py
      - name: Install, audit, lint, type-check and build the site
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build
      - name: Smoke and accessibility tests (Playwright + axe) on every route
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Lighthouse CI (desktop and mobile budgets)
        working-directory: web
        run: npm run lhci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-test-results
          path: |
            web/test-results/
            web/.lighthouseci/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build every image target (slim API, dashboard, full pipeline)
        run: |
          for target in api dashboard pipeline; do
            docker build --target "$target" -t "immodash-$target" .
          done
          docker images | grep immodash
      - name: The API image contains no private notes, secrets or tests
        run: |
          docker run --rm --entrypoint sh immodash-api -c 'test ! -e /app/.private && test ! -e /app/.env && test ! -e /app/tests && test ! -e /app/web'
          docker run --rm --entrypoint python immodash-api -c "import api.main; print('api imports ok')"
